<style>

* { box-sizing: border-box; }

.btn:hover { border-color:var(--accent); }

.home .features { display:grid; gap:72px; margin-top:88px; }
.home .feature { display:grid; grid-template-columns:1fr 300px; gap:48px; align-items:center; }
.home .feature:nth-child(even) { grid-template-columns:300px 1fr; }
.home .feature:nth-child(even) .text { order:2; }
.home .feature h2 { font-size:clamp(24px, 3vw, 32px); line-height:1.15; margin:0 0 12px; letter-spacing:-.01em; }
.home .feature p { font-size:18px; color:var(--muted); margin:0; max-width:46ch; }
