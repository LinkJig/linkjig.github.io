name: Bug report
description: Something in LinkJig does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: diagnostic
    attributes:
      label: Diagnostic report
      description: Options → Help → Copy diagnostic report, then paste it here. It holds no terminal data, serial numbers or addresses.
      render: text
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device or adapter
      placeholder: e.g. ESP32 DevKit via CP2102N, HM-10 module
