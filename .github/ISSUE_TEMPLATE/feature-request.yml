name: Feature request
description: Suggest something LinkJig should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or test you want to get done, not the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How would you like it to work?
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Windows, Android, Both]
    validations:
      required: true
