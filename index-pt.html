<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LinkJig</title>
<style>
:root { --bg:#0C0F13; --surface:#12161C; --border:#242B35; --text:#E6EAF0; --muted:#9AA6B4; --accent:#2DD4BF; }
@media (prefers-color-scheme: light) {
  :root { --bg:#F6F8FA; --surface:#FFFFFF; --border:#D5DCE4; --text:#11161D; --muted:#4A5563; --accent:#08705F; }
}
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--text);
  font:16px/1.6 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width:760px; margin:0 auto; padding:24px 16px 64px; }
nav { display:flex; flex-wrap:wrap; gap:4px 14px; font-size:14px; padding-bottom:16px;
  border-bottom:1px solid var(--border); margin-bottom:24px; }
nav a, nav span { color:var(--muted); text-decoration:none; }
nav span { color:var(--accent); }
a { color:var(--accent); }
h1 { font-size:28px; line-height:1.25; margin:0 0 4px; }
h2 { font-size:19px; margin:32px 0 8px; }
p, li { color:var(--text); }
em { color:var(--muted); font-style:normal; font-size:14px; }
code { font:14px "JetBrains Mono", ui-monospace, Consolas, monospace; background:var(--surface);
  border:1px solid var(--border); border-radius:4px; padding:1px 4px; }
table { width:100%; border-collapse:collapse; font-size:15px; }
th, td { text-align:left; vertical-align:top; padding:8px; border-bottom:1px solid var(--border); }
th { color:var(--muted); font-weight:600; }
.mark { display:inline-block; width:10px; height:10px; border-radius:2px; background:var(--accent); margin-right:8px; }
.lead { font-size:18px; color:var(--muted); }
.links a { display:inline-block; margin:4px 16px 4px 0; }
details { border-bottom:1px solid var(--border); }
summary { cursor:pointer; padding:12px 0; font-weight:600; }
details > p:first-of-type, details > ul:first-of-type { margin-top:0; }
details[open] summary { color:var(--accent); }
.back { font-size:14px; margin:0 0 16px; }
@media (max-width:560px) { table, tbody, tr, td { display:block; } thead { display:none; }
  tr { border-bottom:1px solid var(--border); padding:6px 0; } td { border:0; padding:2px 0; } }
</style>
</head>

</main></body>
</html>
